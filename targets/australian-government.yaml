collection: Australian Government
description: >
  Prominent Commonwealth services and departmental sites. Chosen for prominence first and
  probed for reachability second, so that the proportion marked excluded is an honest
  measure of how much of government this tool can see rather than an artefact of picking
  the sites that let us in. Reachability probed from the deployed scanner in us-east-1 via
  GET /api/reachable on 2026-10-14.

targets:
  - site_id: abs
    agency: Australian Bureau of Statistics
    service: abs.gov.au
    entry_url: https://www.abs.gov.au/
    status: active
    checked_at: 2026-10-14

