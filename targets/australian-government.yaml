  - site_id: servicesaustralia
    agency: Services Australia
    service: servicesaustralia.gov.au
    entry_url: https://www.servicesaustralia.gov.au/
    status: excluded
    reason: >
      Accepts the connection and then drops the request without responding, so no page can
      be read. Characteristic of a content delivery network with bot management. The site
      works normally for people in Australia; this records only what the scanner in
      us-east-1 can reach.
    checked_at: 2026-10-14

  - site_id: ato
    agency: Australian Taxation Office
    service: ato.gov.au
    entry_url: https://www.ato.gov.au/
    status: excluded
    reason: >
      Returns HTTP 403 to the scanner. Accepted the scanner earlier in October 2026, which
      is a reminder that bot management decisions change without notice and an exclusion
      here is a snapshot rather than a verdict.
    checked_at: 2026-10-14

  - site_id: health
    agency: Department of Health, Disability and Ageing
    service: health.gov.au
    entry_url: https://www.health.gov.au/
    status: excluded
    reason: >
      Connection accepted, request dropped without a response. No page can be read, so no
      score is produced.
    checked_at: 2026-10-14

  - site_id: digital
    agency: Digital Transformation Agency
    service: digital.gov.au
    entry_url: https://www.digital.gov.au/
    status: excluded
    reason: >
      Connection accepted, request dropped without a response. This is the site that
      publishes the Digital Experience Policy itself, and it cannot be assessed against it
      from outside.
    checked_at: 2026-10-14

