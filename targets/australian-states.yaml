collection: Australian states, territories and local government
description: >
  State, territory and major local government services. Chosen for prominence first and
  probed for reachability second, so the proportion marked excluded is an honest measure
  of how much of government this tool can see rather than an artefact of picking sites
  that let us in. Reachability probed from the deployed scanner in us-east-1 via
  GET /api/reachable on 2026-10-14. Note that reachability is a property of a network
  location, not of a site: some of these answer an Australian client and refuse this one.

